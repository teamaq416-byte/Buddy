<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Buddy</title>
<style>
:root{
  --bg:#16171b; --bg2:#1c1d22; --bg3:#232429; --bg4:#2d2e35; --line:rgba(255,255,255,.07); --line2:rgba(255,255,255,.11);
  --fg:#ececf1; --muted:#a3a4ae; --dim:#6d6e79; --accent:#7dd3fc; --accent-rgb:125,211,252;
  --brand:#7c9cff; --brand-ink:#0f1220; --brand-rgb:124,156,255;
  --ok:#4ade80; --warn:#f5b748; --bad:#f87171; --radius:12px;
  --font:"Segoe UI Variable Text","Segoe UI",system-ui,-apple-system,sans-serif; --display:"Segoe UI Variable Display","Segoe UI",system-ui,sans-serif; --mono:"Cascadia Mono",Consolas,ui-monospace,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--fg);font:13.5px/1.5 var(--font);overflow:hidden;-webkit-font-smoothing:antialiased;user-select:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,summary:focus-visible{outline:2px solid rgba(var(--brand-rgb),.7);outline-offset:1px}
input,textarea,select{font:inherit;color:inherit}
::-webkit-scrollbar{width:10px}::-webkit-scrollbar-thumb{background:var(--bg4);border-radius:10px;border:3px solid var(--bg)}::-webkit-scrollbar-track{background:transparent}
.app{display:flex;flex-direction:column;height:100%;border:1px solid var(--line2);background:var(--bg)}
code{font-family:var(--mono);font-size:12px;background:var(--bg3);padding:1px 5px;border-radius:5px}

/* header */
.hdr{display:flex;align-items:center;gap:11px;padding:12px 10px 10px 16px;background:var(--bg)}
.hdr button{-webkit-app-region:no-drag}
.face{width:30px;height:30px;border-radius:50%;background:#f3f4fb;position:relative;flex:none;transition:transform .25s cubic-bezier(.34,1.56,.64,1)}
.face::before,.face::after{content:"";position:absolute;top:9px;width:4.5px;height:10px;border-radius:3px;background:#181b28;transition:height .12s}
.face::before{left:9px}.face::after{right:9px}
.face.blink::before,.face.blink::after{height:2px;top:13px}
.face.talk{animation:talk .5s ease-in-out infinite}
@keyframes talk{50%{transform:scale(1.06,.94)}}
.hdr .who{flex:1;min-width:0;line-height:1.3}
.hdr .name{font:600 15px/1.25 var(--display);letter-spacing:-.005em}
.hdr .status{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hbtn{display:flex;align-items:center;gap:6px;height:28px;padding:0 10px;border-radius:8px;border:1px solid var(--line2);color:var(--muted);font-size:12px;transition:background .15s,color .15s}
.hbtn:hover{background:var(--bg3);color:var(--fg)}
.hbtn svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.dot{width:7px;height:7px;border-radius:50%;background:var(--dim);flex:none}
.dot.on{background:var(--ok)}.dot.bad{background:var(--bad)}.dot.ok{background:var(--ok)}.dot.pulse{background:var(--warn);animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{opacity:.35}}
.icon{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;color:var(--muted);transition:background .15s,color .15s;flex:none}
.icon:hover{background:var(--bg3);color:var(--fg)}
.icon svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.drag{-webkit-app-region:drag}

/* tabs */
.nav{display:flex;gap:2px;padding:0 10px;border-bottom:1px solid var(--line)}
.nav button{position:relative;display:flex;align-items:center;gap:7px;padding:9px 10px 10px;color:var(--muted);font-size:12.5px;font-weight:500;transition:color .15s}
.nav button:hover{color:var(--fg)}
.nav button.active{color:var(--fg)}
.nav button.active::after{content:"";position:absolute;left:8px;right:8px;bottom:-1px;height:2px;border-radius:2px;background:var(--brand)}
.nav svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* provider picker (inside the composer) */
.pbar{position:relative}
.pick{display:flex;align-items:center;gap:6px;height:28px;padding:0 8px 0 9px;border-radius:8px;color:var(--muted);font-size:12.5px;font-weight:500;transition:background .15s,color .15s}
.pick:hover{background:var(--bg4);color:var(--fg)}
.pick .dot{background:var(--p,var(--accent))}
.pick svg{width:13px;height:13px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.seg{position:absolute;left:0;bottom:calc(100% + 8px);min-width:190px;background:var(--bg2);border:1px solid var(--line2);border-radius:12px;padding:5px;box-shadow:0 14px 36px rgba(0,0,0,.55);display:none;flex-direction:column;gap:1px;z-index:5}
.seg.open{display:flex}
.seg .segh{font-size:11.5px;color:var(--dim);padding:4px 9px 5px}
.seg button{display:flex;align-items:center;gap:9px;padding:7px 9px;border-radius:8px;font-size:13px;color:var(--fg);text-align:left}
.seg button:hover{background:var(--bg4)}
.seg button .dot{background:var(--p)}
.seg button .l{flex:1}.seg button .ck{color:var(--brand);font-size:12px}

/* views */
.view{flex:1;overflow:auto;display:none;padding:16px 16px 8px;scroll-behavior:smooth}
.view.active{display:block}
.empty{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;color:var(--muted);text-align:center;padding:30px}
.empty .face{width:52px;height:52px;margin-bottom:6px}.empty .face::before,.empty .face::after{top:16px;width:7.5px;height:17px;border-radius:5px}.empty .face::before{left:16px}.empty .face::after{right:16px}
.empty h3{color:var(--fg);font:600 17px/1.3 var(--display)}
.ideas{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:18px;width:100%;max-width:400px}
.idea{display:flex;flex-direction:column;gap:2px;text-align:left;padding:11px 12px;border-radius:12px;background:var(--bg2);border:1px solid var(--line);transition:background .15s,border-color .15s}
.idea:hover{background:var(--bg3);border-color:var(--line2)}
.idea b{font-weight:600;font-size:13px;color:var(--fg)}.idea small{font-size:11.5px;color:var(--muted);line-height:1.4}
.chip{background:transparent;border:1px solid var(--line2);border-radius:999px;padding:4px 11px;font-size:12px;color:var(--muted);cursor:pointer;transition:background .15s,color .15s}
.chip:hover{background:var(--bg3);color:var(--fg)}

/* messages */
.msg{display:flex;flex-direction:column;margin:0 0 16px;animation:in .22s cubic-bezier(.2,.8,.2,1)}
@keyframes in{from{opacity:0;transform:translateY(4px)}}
.msg.user{align-items:flex-end}
.msg.user .bubble .uimgs{display:grid;gap:3px;margin:-4px -9px 6px;border-radius:12px;overflow:hidden;max-width:300px}.msg.user .bubble .uimgs:last-child{margin-bottom:-4px}.msg.user .bubble .uimgs.n2,.msg.user .bubble .uimgs.n4{grid-template-columns:1fr 1fr}.msg.user .bubble .uimgs.n3{grid-template-columns:1fr 1fr 1fr}.msg.user .bubble .uimgs img{width:100%;max-height:300px;object-fit:cover;display:block;cursor:zoom-in}.msg.user .bubble .uimgs.n2 img,.msg.user .bubble .uimgs.n3 img,.msg.user .bubble .uimgs.n4 img{height:120px}
.file.pic{border-radius:10px;padding:3px 6px 3px 3px}.file.pic img{width:34px;height:34px;border-radius:7px;object-fit:cover}
.msg.user .bubble{background:var(--bg3);border:1px solid var(--line);border-radius:16px 16px 4px 16px;padding:8px 13px;max-width:84%;user-select:text;white-space:pre-wrap;word-break:break-word}
.msg.ai .card{padding:0 2px;max-width:100%;user-select:text}
.msg.ai .label{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--muted);margin-bottom:5px}
.msg.ai .label b{color:var(--fg);font-weight:600}
.msg.ai .label .dot{background:var(--p,var(--accent))}
.msg.ai .label time{margin-left:auto;color:var(--dim);font-size:11.5px}
.steps{display:flex;flex-direction:column;gap:4px;margin:4px 0 10px;padding:8px 10px;background:var(--bg2);border:1px solid var(--line);border-radius:10px}
.step{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted)}
.step .ico{width:14px;height:14px;flex:none;display:grid;place-items:center}
.step .ico svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.step.running .ico{color:var(--brand)}.step.running .ico svg{animation:spin 1s linear infinite}
.step.done .ico{color:var(--ok)}.step.error .ico{color:var(--bad)}
.step b{color:var(--fg);font-weight:600;min-width:42px}
.step code{font-family:var(--mono);font-size:11.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;background:none;padding:0}
@keyframes spin{to{transform:rotate(360deg)}}
.body{word-break:break-word;line-height:1.6}
.body p{margin:0 0 9px}.body p:last-child{margin:0}
.body ul,.body ol{margin:0 0 9px 20px}.body li{margin:3px 0}
.body h1,.body h2,.body h3{font:600 14px/1.4 var(--display);margin:10px 0 4px}
.body a{color:var(--brand);text-decoration:none}.body a:hover{text-decoration:underline}
.body pre{position:relative;background:#0f1013;border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:6px 0 10px;overflow:auto;font-family:var(--mono);font-size:12px;line-height:1.5}
.body pre code{background:none;padding:0;font-size:12px}
.body pre .copy{position:absolute;top:6px;right:6px;font-size:11px;color:var(--muted);background:var(--bg3);border-radius:6px;padding:2px 8px;opacity:0;transition:opacity .15s}
.body pre:hover .copy{opacity:1}
.imgs{display:grid;gap:4px;margin:2px 0 8px;max-width:340px}.imgs.n2,.imgs.n3,.imgs.n4{grid-template-columns:1fr 1fr}
.img{position:relative;margin:0;background:#0f1013;border-radius:12px;overflow:hidden}
.img img{display:block;width:100%;max-height:340px;object-fit:cover;cursor:zoom-in}.imgs.n2 .img img,.imgs.n3 .img img,.imgs.n4 .img img{height:150px}
.img .dl{position:absolute;right:8px;bottom:8px;width:32px;height:32px;border-radius:50%;background:rgba(0,0,0,.55);display:grid;place-items:center}.img .dl:hover{background:rgba(0,0,0,.75)}.img .dl svg{width:16px;height:16px;fill:none;stroke:#fff;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.cursor{display:inline-block;width:7px;height:14px;background:var(--brand);border-radius:2px;vertical-align:-2px;margin-left:2px;animation:pulse .9s ease-in-out infinite}
.msg.sys{align-items:center}
.msg.sys .pill{display:flex;align-items:flex-start;gap:8px;background:transparent;border:1px solid var(--line);border-radius:10px;padding:6px 12px;font-size:12.5px;color:var(--muted);max-width:94%;white-space:pre-wrap;user-select:text}
.msg.sys .pill>.face{display:none}
.msg.sys .pill .chip{margin-left:6px}
.msg.sys.error .pill{border-color:rgba(248,113,113,.35);background:rgba(248,113,113,.07);color:#fca5a5}
/* permission requests: a clear card with the action and both choices */
.msg.sys.perm{align-items:stretch}
.msg.sys.perm .pill{display:block;max-width:100%;background:var(--bg2);border:1px solid var(--line);border-left:3px solid var(--warn);border-radius:10px;padding:10px 12px;color:var(--fg);white-space:normal}
.msg.sys.perm .pill b{font-weight:600;display:block;font-size:13px}
.msg.sys.perm .ph{display:flex;align-items:center;gap:8px;margin-bottom:4px;font-size:11.5px}
.msg.sys.perm .tag{color:var(--warn);font-weight:600}
.msg.sys.perm .svc{color:var(--dim);margin-left:auto;font-family:var(--mono)}
.msg.sys.perm .pd{font-family:var(--mono);font-size:11.5px;color:var(--muted);background:var(--bg3);border-radius:6px;padding:5px 8px;margin-top:6px;white-space:pre-wrap;word-break:break-all;max-height:120px;overflow:auto}
.msg.sys.perm .pr{font-size:12px;color:var(--muted);margin-top:5px}
.msg.sys.perm .pa{display:flex;gap:6px;margin-top:10px}
.msg.sys.perm .pa .btn{padding:5px 14px}
.msg.sys.perm.settled .pill{border-left-color:var(--line2);background:transparent;padding:7px 12px}
.msg.sys.perm.settled .pd,.msg.sys.perm.settled .pr{display:none}
.msg.sys.perm.settled b{font-weight:500;color:var(--muted)}
.msg.sys.perm.accepted .tag{color:var(--ok)}.msg.sys.perm.denied .tag{color:var(--bad)}
kbd{font-family:var(--font);font-size:10.5px;border:1px solid var(--line2);border-bottom-width:2px;border-radius:4px;padding:0 4px;color:var(--muted)}
.divider{text-align:center;color:var(--dim);font-size:11.5px;margin:2px 0 16px}

/* composer */
.composer{border-top:1px solid var(--line);padding:10px 14px 10px;background:var(--bg);position:relative}
.files{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.files:empty{display:none}
.file{display:flex;align-items:center;gap:6px;background:var(--bg3);border:1px solid var(--line);border-radius:999px;padding:3px 6px 3px 9px;font-size:12px;max-width:100%}
.file span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:180px;cursor:pointer}
.file button{width:18px;height:18px;border-radius:50%;color:var(--muted);display:grid;place-items:center;font-size:14px;line-height:1}
.file button:hover{background:var(--bg4);color:var(--fg)}
.box{background:var(--bg2);border:1px solid var(--line2);border-radius:16px;padding:8px 8px 6px;display:flex;flex-direction:column;gap:2px;transition:border-color .15s,box-shadow .15s}
.box .files{margin:0 0 4px}
.box textarea{padding:4px 6px 6px}
.tools{display:flex;align-items:center;gap:2px}
.tools .sp{flex:1}
.tools .icon{width:30px;height:28px}
.box:focus-within{border-color:rgba(var(--brand-rgb),.6);box-shadow:0 0 0 3px rgba(var(--brand-rgb),.12)}
textarea{flex:1;background:none;border:0;outline:0;resize:none;min-height:24px;max-height:160px;padding:7px 0;line-height:1.45;font-size:13.5px}
textarea::placeholder{color:var(--dim)}
.box textarea:focus-visible{outline:0}
.mode{display:flex;height:28px;padding:2px;border-radius:9px;background:var(--bg3);border:1px solid var(--line);flex:none;margin-right:6px}
.mode span{display:grid;place-items:center;padding:0 11px;border-radius:7px;font-size:12px;font-weight:600;color:var(--dim);transition:background .15s,color .15s}
.mode:not(.on) span:first-child{background:var(--bg4);color:var(--fg)}
.mode.on span:last-child{background:rgba(245,183,72,.2);color:var(--warn)}
.mode:hover span{color:var(--muted)}.mode:not(.on):hover span:first-child,.mode.on:hover span:last-child{color:inherit}
.send{width:32px;height:32px;border-radius:10px;background:var(--brand);color:var(--brand-ink);display:grid;place-items:center;flex:none;transition:transform .12s,filter .15s}
.send:hover{filter:brightness(1.08)}.send:active{transform:scale(.94)}
.send.stop{background:var(--bad)}
.send svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.send.stop svg{fill:currentColor;stroke:none}
.hint{display:flex;align-items:center;gap:6px;margin-top:7px;padding:0 4px;font-size:11.5px;color:var(--dim)}
.hint .sp{flex:1}
.hint #foot{color:var(--muted);display:flex;align-items:center;gap:6px;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hint #foot b{color:var(--fg);font-weight:500}
.mtag{font-size:10.5px;font-weight:700;letter-spacing:.02em;padding:1px 6px;border-radius:5px;background:var(--bg4);color:var(--muted)}
.mtag.do{background:rgba(245,183,72,.18);color:var(--warn)}
.slash{position:absolute;left:14px;right:14px;bottom:100%;margin-bottom:6px;background:var(--bg2);border:1px solid var(--line2);border-radius:12px;padding:6px;box-shadow:0 12px 32px rgba(0,0,0,.5);display:none}
.slash.show{display:block}
.slash div{padding:6px 10px;border-radius:8px;font-size:12.5px;display:flex;gap:10px;cursor:pointer}
.slash div.sel,.slash div:hover{background:var(--bg4)}
.slash code{font-family:var(--mono);color:var(--brand);min-width:120px;background:none;padding:0}
.slash span{color:var(--muted)}

/* generic controls */
.section{margin-bottom:22px}
.section h4,.set-group>h4{font:600 12.5px/1.3 var(--font);color:var(--muted);margin:0 2px 8px}
.row{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.row label{width:120px;color:var(--muted);font-size:12.5px;flex:none}
.in{flex:1;min-width:0;background:var(--bg3);border:1px solid var(--line);border-radius:8px;padding:7px 10px;outline:0;transition:border-color .15s;font-size:13px}
.in:focus{border-color:rgba(var(--brand-rgb),.6)}.in:focus-visible{outline:0;box-shadow:0 0 0 3px rgba(var(--brand-rgb),.12)}
.btn{background:var(--bg3);border:1px solid var(--line2);border-radius:8px;padding:6px 13px;font-size:12.5px;font-weight:500;transition:background .15s,filter .15s;white-space:nowrap}
.btn:disabled{opacity:.45;cursor:default;pointer-events:none}
.btn:hover{background:var(--bg4)}
.btn.primary{background:var(--brand);color:var(--brand-ink);border-color:transparent;font-weight:600}
.btn.primary:hover{filter:brightness(1.08);background:var(--brand)}
.btn.danger{color:var(--bad)}
.toggle{display:flex;align-items:center;gap:10px;cursor:pointer;font-size:13px}
.toggle input,input.sw{appearance:none;flex:none;width:36px;height:20px;border-radius:999px;background:var(--bg4);position:relative;transition:background .15s;cursor:pointer;margin:0}
.toggle input::after,input.sw::after{content:"";position:absolute;top:3px;left:3px;width:14px;height:14px;border-radius:50%;background:#d7d8de;transition:transform .15s,background .15s}
.toggle input:checked,input.sw:checked{background:var(--brand)}.toggle input:checked::after,input.sw:checked::after{transform:translateX(16px);background:#fff}
input.sw:disabled{opacity:.4;cursor:default}
.radio{display:flex;gap:2px;background:var(--bg3);border:1px solid var(--line);border-radius:9px;padding:2px}
.radio button{padding:5px 12px;border-radius:7px;font-size:12.5px;color:var(--muted)}
.radio button:hover{color:var(--fg)}
.radio button.active{color:var(--fg);background:var(--bg4)}
.note{font-size:12px;color:var(--muted);margin-top:-4px;margin-bottom:10px;line-height:1.5}
.problem{color:var(--bad);font-size:12.5px;margin:6px 0}
.saved{color:var(--ok);font-size:12.5px;margin:6px 0}

/* settings: grouped cards, label + description on the left, control on the right */
.set-group{margin-bottom:20px}
.set-group>.card{background:var(--bg2);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
.srow{display:flex;align-items:center;gap:14px;padding:11px 14px;min-height:48px;cursor:default}
label.srow{cursor:pointer}
.srow+.srow,.srow+.sblock,.sblock+.srow,.sblock+.sblock{border-top:1px solid var(--line)}
.srow .st{flex:1;min-width:0}
.srow .st b{display:block;font-weight:500;font-size:13px}
.srow .st small{display:block;color:var(--muted);font-size:12px;line-height:1.45;margin-top:1px}
.srow .in{flex:0 1 200px}
.ctl{display:flex;gap:6px;align-items:center;flex:none}
.sblock{padding:12px 14px}
.sblock .note{margin:0 0 8px}
.set-foot{position:sticky;bottom:-8px;margin:8px -16px -8px;padding:10px 16px;background:linear-gradient(to bottom,rgba(22,23,27,0),var(--bg) 30%);display:flex;align-items:center;gap:10px}
.set-foot .ver{flex:1;color:var(--dim);font-size:12px}
details.more>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:8px;color:var(--fg);font-weight:500;font-size:13px}
details.more>summary::-webkit-details-marker{display:none}
details.more>summary::after{content:"";margin-left:auto;width:7px;height:7px;border-right:1.6px solid var(--muted);border-bottom:1.6px solid var(--muted);transform:rotate(45deg);transition:transform .15s}
details.more[open]>summary::after{transform:rotate(225deg)}
details.more>summary small{color:var(--muted);font-weight:400}

/* tasks */
.task{display:flex;align-items:flex-start;gap:10px;padding:9px 10px;border-radius:9px;transition:background .15s}
.task:hover{background:var(--bg2)}
.task input{appearance:none;width:18px;height:18px;border-radius:5px;border:1.5px solid var(--line2);flex:none;margin-top:1px;cursor:pointer;display:grid;place-items:center;transition:background .15s,border-color .15s}
.task input:checked{background:var(--brand);border-color:var(--brand)}
.task input:checked::after{content:"";width:5px;height:9px;border:solid var(--brand-ink);border-width:0 2px 2px 0;transform:rotate(45deg) translate(-1px,-1px)}
.task span{flex:1;word-break:break-word}
.task.done span{color:var(--dim);text-decoration:line-through}
.task time{font-size:11.5px;color:var(--dim);flex:none}

/* planner */
.ptabs{display:flex;gap:2px;background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:3px;margin-bottom:14px}
.ptabs button{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;padding:6px 8px;border-radius:7px;font-size:12.5px;font-weight:500;color:var(--muted);transition:background .15s,color .15s}
.ptabs button:hover{color:var(--fg)}.ptabs button.active{background:var(--bg4);color:var(--fg)}
.ptabs .cnt{font-size:10.5px;font-weight:700;min-width:16px;padding:0 5px;border-radius:999px;background:rgba(var(--brand-rgb),.2);color:var(--brand);line-height:16px}.ptabs .cnt:empty{display:none}
.pform{background:var(--bg2);border:1px solid var(--line);border-radius:var(--radius);padding:12px;display:flex;flex-direction:column;gap:10px;margin-bottom:16px}
.pform textarea.in{resize:vertical;min-height:64px;line-height:1.45}
.prow{display:flex;gap:10px;align-items:flex-end}.prow>label{flex:1;display:flex;flex-direction:column;gap:5px;font-size:11.5px;color:var(--muted);min-width:0}
.prow.end{justify-content:flex-end;align-items:center}.prow .radio{align-self:flex-start}
.perr{flex:1;color:var(--bad);font-size:12px}
.qchips{display:flex;gap:6px;flex-wrap:wrap}.qchips .chip.on{background:rgba(var(--brand-rgb),.16);border-color:rgba(var(--brand-rgb),.5);color:var(--fg)}
.in[type=datetime-local],select.in{color-scheme:dark;width:100%}
select.in{appearance:none;cursor:pointer;padding-right:26px;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6'><path d='M1 1l4 4 4-4' fill='none' stroke='%23a3a4ae' stroke-width='1.5'/></svg>");background-repeat:no-repeat;background-position:right 10px center}
.ph4{font:600 12.5px/1.3 var(--font);color:var(--muted);margin:0 2px 8px}
.pitem{display:flex;align-items:flex-start;gap:11px;padding:11px 12px;background:var(--bg2);border:1px solid var(--line);border-radius:12px;margin-bottom:8px;animation:in .22s cubic-bezier(.2,.8,.2,1)}
.pitem.off{opacity:.62}
.pico{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;flex:none}
.pico svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.pico.bell{background:rgba(245,183,72,.14);color:var(--warn)}.pico.clock{background:rgba(var(--brand-rgb),.14);color:var(--brand)}
.pitem .pt{flex:1;min-width:0}.pitem .pt b{display:block;font-weight:500;word-break:break-word}
.pitem .pt small{display:flex;flex-wrap:wrap;align-items:center;gap:5px;color:var(--muted);font-size:12px;margin-top:3px}
.pitem .pt small.last.ok{color:var(--ok)}.pitem .pt small.last.bad{color:var(--bad)}
.badge{font-size:10.5px;font-weight:600;padding:1px 7px;border-radius:999px;background:var(--bg4);color:var(--muted)}.badge.do{background:rgba(245,183,72,.18);color:var(--warn)}
.pact{display:flex;align-items:center;gap:6px;flex:none}.pact .btn{padding:4px 10px;font-size:12px}
.pitem .icon{width:28px;height:28px}
.pempty{display:flex;flex-direction:column;gap:4px;align-items:center;text-align:center;color:var(--muted);padding:26px 16px;font-size:12.5px}.pempty b{color:var(--fg);font-weight:600;font-size:13.5px}
/* continue menu */
.contwrap{position:relative}.hbtn .chev{width:12px;height:12px;margin-left:-2px;opacity:.7}
.contmenu{position:absolute;right:0;top:calc(100% + 6px);width:300px;background:var(--bg2);border:1px solid var(--line2);border-radius:12px;padding:5px;box-shadow:0 16px 40px rgba(0,0,0,.55);display:none;z-index:30;-webkit-app-region:no-drag}
.contmenu.open{display:block;animation:in .16s}
.cmh{font-size:11.5px;color:var(--dim);padding:5px 10px 6px}
.cmi{display:flex;gap:11px;align-items:flex-start;width:100%;text-align:left;padding:9px 10px;border-radius:9px;transition:background .12s}.cmi:hover{background:var(--bg4)}.cmi:disabled{opacity:.45;cursor:default}.cmi:disabled:hover{background:none}
.cmic{width:30px;height:30px;border-radius:8px;background:var(--bg3);display:grid;place-items:center;flex:none;color:var(--brand)}.cmic svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.cmt{display:flex;flex-direction:column;min-width:0}.cmt b{font-weight:600;font-size:13px}.cmt small{color:var(--muted);font-size:11.5px;line-height:1.4;margin-top:1px}
/* assistant extras */
.ptabs button{padding:6px 4px;font-size:12px}
.ptop{display:flex;align-items:flex-start;gap:10px;margin:0 2px 12px}.ptop>div{flex:1;min-width:0}.ptop b{display:block;font-weight:600}.ptop small{display:block;color:var(--muted);font-size:12px;line-height:1.45;margin-top:2px}
.tpls{display:grid;grid-template-columns:1fr 1fr;gap:8px}.tpl{display:flex;flex-direction:column;gap:4px;padding:11px 12px;background:var(--bg2);border:1px solid var(--line);border-radius:12px}.tpl b{font-weight:600;font-size:13px}.tpl small{color:var(--muted);font-size:11.5px;line-height:1.4;flex:1}.tpl .btn{align-self:flex-start;margin-top:4px;padding:4px 11px}
.wstep{background:var(--bg3);border:1px solid var(--line);border-radius:10px;padding:8px;display:flex;flex-direction:column;gap:6px}
.wsh{display:flex;align-items:center;gap:6px}.wsh .sp{flex:1}.wsh select.in{width:auto;flex:0 1 auto;padding:5px 24px 5px 9px;font-size:12px}.wsh .radio button{padding:4px 9px;font-size:12px}.wsh .icon{width:26px;height:26px;font-size:13px}
.wn{width:20px;height:20px;border-radius:50%;background:var(--bg4);display:grid;place-items:center;font-size:11px;font-weight:700;color:var(--muted);flex:none}
.wstep textarea.in{min-height:46px;resize:vertical;font-size:12.5px}
.jst{width:30px;height:30px;border-radius:9px;flex:none;display:grid;place-items:center;background:var(--bg3)}
.jst::after{content:"";width:10px;height:10px;border-radius:50%}
.jst.run::after{border:2px solid var(--brand);border-right-color:transparent;animation:spin 1s linear infinite;width:12px;height:12px;box-sizing:border-box}
.jst.q::after{background:var(--dim)}.jst.ok::after{background:var(--ok)}.jst.bad::after{background:var(--bad)}.jst.ev::after{background:var(--warn)}
.job .pt{cursor:pointer}.jout{margin-top:7px;padding:7px 9px;border-radius:8px;background:var(--bg3);font:11.5px/1.5 var(--mono);color:var(--muted);white-space:pre-wrap;word-break:break-word;max-height:58px;overflow:hidden;user-select:text}.jout.open{max-height:340px;overflow:auto;color:var(--fg)}
.jsteps{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}.jstep{font-size:10.5px;padding:1px 7px;border-radius:999px;background:var(--bg4);color:var(--dim)}.jstep.running{color:var(--brand)}.jstep.done{color:var(--ok)}.jstep.error{color:var(--bad)}
.jlink{font-size:12px;color:var(--brand);text-decoration:none;display:inline-block;margin-top:4px}
.picktip{display:flex;align-items:center;gap:8px;margin:0 0 8px;padding:6px 6px 6px 11px;border-radius:10px;background:rgba(var(--brand-rgb),.1);border:1px solid rgba(var(--brand-rgb),.28);font-size:12px;color:var(--muted);animation:in .22s}
.picktip span{flex:1}.picktip b{color:var(--fg)}.picktip .btn{padding:3px 10px;font-size:12px}.picktip .icon{width:24px;height:24px}
.msg.ai .label .say{width:22px;height:22px;border-radius:6px;display:grid;place-items:center;color:var(--dim);opacity:0;transition:opacity .15s}.msg.ai:hover .label .say{opacity:1}.msg.ai .label .say:hover{background:var(--bg3);color:var(--fg)}
.msg.ai .label .say svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.msg.ai .label time{margin-left:0}.msg.ai .label .say{margin-left:auto}
.msg.flash .card,.msg.flash .bubble{box-shadow:0 0 0 2px rgba(var(--brand-rgb),.6);border-radius:12px;transition:box-shadow .3s}
#mic.on{color:var(--bad);background:rgba(248,113,113,.12)}#mic.on svg{animation:pulse 1s ease-in-out infinite}
.csearch{border-bottom:1px solid var(--line);background:var(--bg);display:flex;flex-direction:column;max-height:60%;animation:in .18s}
.csh{display:flex;gap:6px;align-items:center;padding:10px 14px 8px}.csh .in{flex:1}
.csr{overflow:auto;padding:0 10px 10px}.csi{padding:8px 10px;border-radius:9px;cursor:pointer;font-size:12.5px;line-height:1.5}.csi:hover{background:var(--bg2)}.csm{display:flex;gap:6px;align-items:center;color:var(--dim);font-size:11.5px;margin-bottom:2px}
mark{background:rgba(245,183,72,.3);color:var(--fg);border-radius:3px;padding:0 1px}
.ghrun{display:flex;align-items:center;gap:8px;padding:5px 2px;font-size:12.5px}.ghrun a{color:var(--fg);text-decoration:none;font-weight:500}.ghrun a:hover{text-decoration:underline}.ghrun small{color:var(--dim);margin-left:auto;font-size:11.5px;white-space:nowrap}
.gst{width:8px;height:8px;border-radius:50%;flex:none}.gst.ok{background:var(--ok)}.gst.bad{background:var(--bad)}.gst.run{background:var(--warn);animation:pulse 1.2s infinite}
.alog{padding:4px 0;border-bottom:1px solid var(--line);font-size:12px}.alog b{color:var(--fg);font-weight:500}.alog small{color:var(--dim);display:block}.alog .ok{color:var(--ok)}.alog .bad{color:var(--bad)}
details.pform>summary{list-style:none;cursor:pointer}details.pform>summary::-webkit-details-marker{display:none}
/* connect */
.cardc{background:var(--bg2);border:1px solid var(--line);border-radius:var(--radius);padding:13px 14px;margin-bottom:10px;display:flex;gap:14px;align-items:flex-start}
.cardc .t{flex:1;min-width:0}
.cardc b{display:block;font-weight:600;font-size:13.5px}
.cardc small{color:var(--muted);display:block;font-size:12px;line-height:1.5;margin-top:2px}
.cardc .st{display:inline-flex;align-items:center;gap:6px;font-size:12px;margin-top:8px;color:var(--fg);background:var(--bg3);border-radius:999px;padding:2px 10px 2px 8px}
.cardc>div:last-child{flex:none}
.ctl.col{flex-direction:column;align-items:stretch}
details.box2{background:var(--bg2);border:1px solid var(--line);border-radius:var(--radius);padding:11px 14px;margin-top:10px}
.steps-ol{margin:8px 0 0 18px;padding:0;line-height:1.55}.steps-ol li{margin:0 0 5px}
.cardc a,.section a,.note a{color:var(--brand);text-decoration:none}
.msgbox{background:var(--bg3);border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:12.5px;color:var(--muted);white-space:pre-wrap;margin-top:8px;user-select:text}
.msgbox.ok{color:var(--ok)}.msgbox.bad{color:var(--bad)}
.toast{position:fixed;left:50%;top:104px;transform:translateX(-50%) translateY(-8px);z-index:20;background:var(--fg);color:var(--bg);font-weight:500;border-radius:999px;padding:7px 15px;font-size:12.5px;opacity:0;pointer-events:none;transition:all .2s;box-shadow:0 8px 24px rgba(0,0,0,.5)}
.toast.show{opacity:1;transform:translateX(-50%)}
.toast.low{top:auto;bottom:22px}

.skins{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.skin{background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:12px 8px 10px;display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;transition:border-color .15s,background .15s}
.skin:hover{background:var(--bg3)}.skin.active{border-color:var(--brand);box-shadow:0 0 0 1px var(--brand) inset}
.skin .prev{width:60px;height:60px;display:flex;align-items:center;justify-content:center}.skin .prev svg,.skin .prev img{width:60px;height:60px}
.skin b{font-size:12.5px;font-weight:600}.skin small{font-size:11px;color:var(--muted);line-height:1.35}
.face.skinned{background:transparent;border-radius:0;box-shadow:none}.face.skinned::before,.face.skinned::after{display:none}.face.skinned svg,.face.skinned img{width:100%;height:100%;display:block}
.skills-list{max-height:140px;overflow:hidden;position:relative;transition:max-height .25s}.skills-list.open{max-height:2000px}
.skills-list:not(.open)::after{content:"";position:absolute;left:0;right:0;bottom:0;height:40px;background:linear-gradient(transparent,var(--bg2))}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<div class="app">
  <div class="hdr drag">
    <div class="face" id="face"></div>
    <div class="who"><div class="name" id="name">Buddy</div><div class="status"><span class="dot" id="pdot"></span><span id="status">Starting…</span></div></div>
    <button class="icon" id="searchbtn" title="Search chats (Ctrl+F)"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg></button>
    <div class="contwrap"><button class="hbtn" id="cont" title="Continue this conversation somewhere else" style="display:none"><svg viewBox="0 0 24 24"><path d="M14 4h6v6M20 4l-9 9"/><path d="M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></svg>Continue<svg class="chev" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg></button><div class="contmenu" id="contmenu"></div></div>
    <button class="icon" id="close" title="Hide (Esc)"><svg viewBox="0 0 24 24"><path d="M18 6L6 18M6 6l12 12"/></svg></button>
  </div>
  <nav class="nav">
    <button data-view="chat" class="active"><svg viewBox="0 0 24 24"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1.1-4.2A8 8 0 1 1 21 12z"/></svg><span>Chat</span></button>
    <button data-view="tasks" title="Tasks, reminders and schedules"><svg viewBox="0 0 24 24"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg><span>Planner</span></button>
    <button data-view="connect"><svg viewBox="0 0 24 24"><path d="M10 13a5 5 0 0 0 7.5.5l3-3a5 5 0 0 0-7-7l-1.7 1.7"/><path d="M14 11a5 5 0 0 0-7.5-.5l-3 3a5 5 0 0 0 7 7l1.7-1.7"/></svg><span>Connect</span></button>
    <button data-view="skins"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><circle cx="9" cy="11" r="1" fill="currentColor"/><circle cx="15" cy="11" r="1" fill="currentColor"/><path d="M9 15.5c1.8 1.4 4.2 1.4 6 0"/></svg><span>Appearance</span></button>
    <button data-view="settings"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg><span>Settings</span></button>
  </nav>

  <div class="view active" id="view-chat"></div>
  <div class="view" id="view-tasks"></div>
  <div class="view" id="view-connect"></div>
  <div class="view" id="view-skins"></div>
  <div class="view" id="view-settings"></div>

  <div class="composer" id="composer">
    <div class="slash" id="slash"></div>
    <div class="box">
      <div class="files" id="files"></div>
      <textarea id="input" rows="1" placeholder="Message Buddy…"></textarea>
      <div class="tools">
        <button class="icon" id="attach" title="Attach files"><svg viewBox="0 0 24 24"><path d="M21.4 11.1l-9.2 9.2a6 6 0 0 1-8.5-8.5l9.2-9.2a4 4 0 0 1 5.7 5.7l-9.2 9.2a2 2 0 0 1-2.8-2.8l8.5-8.5"/></svg></button>
        <button class="icon" id="snip" title="Screenshot an area (Win+Shift+X)"><svg viewBox="0 0 24 24"><path d="M3 8a2 2 0 0 1 2-2h2l2-3h6l2 3h2a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><circle cx="12" cy="13" r="3.5"/></svg></button>
        <button class="icon" id="mic" title="Voice input"><svg viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></button>
        <div class="pbar" id="pbar"><button class="pick" id="pick" title="Choose which AI answers"><span class="dot"></span><span id="pickname">AI</span><svg viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg></button><div class="seg" id="seg"></div></div>

</div>
<div class="toast" id="toast"></div>

<script>
(() => {
const $ = s => document.querySelector(s);
const api = () => window.pywebview && window.pywebview.api;
const call = (m, ...a) => { const p = api(); return p && p[m] ? Promise.resolve(p[m](...a)) : Promise.resolve(null); };
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const S = { snap:null, current:null, steps:null, text:'', busy:false, view:'chat', provider:null, slashSel:0 };

/* ---------- markdown-lite ---------- */
function inline(t){
  t = esc(t);
  t = t.replace(/`([^`\n]+)`/g, '<code>$1</code>');
  t = t.replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>').replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<i>$2</i>');
  t = t.replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g, '<a href="$2" target="_blank">$1</a>');
  t = t.replace(/(^|[\s(])((https?:\/\/)[^\s<)]+)/g, '$1<a href="$2" target="_blank">$2</a>');
  return t;
}
function md(src){
  const out = []; const lines = String(src).replace(/\r/g,'').split('\n'); let i = 0;
  while (i < lines.length){
    const l = lines[i];
    const fence = l.match(/^```(\w*)/);
    if (fence){ const buf=[]; i++; while(i<lines.length && !/^```/.test(lines[i])) buf.push(lines[i++]); i++;
      out.push(`<pre><button class="copy">Copy</button><code data-lang="${esc(fence[1])}">${esc(buf.join('\n'))}</code></pre>`); continue; }
    if (/^#{1,3}\s/.test(l)){ out.push(`<h3>${inline(l.replace(/^#+\s/,''))}</h3>`); i++; continue; }
    if (/^\s*[-*]\s/.test(l)){ const items=[]; while(i<lines.length && /^\s*[-*]\s/.test(lines[i])) items.push(`<li>${inline(lines[i++].replace(/^\s*[-*]\s/,''))}</li>`); out.push(`<ul>${items.join('')}</ul>`); continue; }
    if (/^\s*\d+[.)]\s/.test(l)){ const items=[]; while(i<lines.length && /^\s*\d+[.)]\s/.test(lines[i])) items.push(`<li>${inline(lines[i++].replace(/^\s*\d+[.)]\s/,''))}</li>`); out.push(`<ol>${items.join('')}</ol>`); continue; }
    if (!l.trim()){ i++; continue; }
    const para=[]; while(i<lines.length && lines[i].trim() && !/^```|^#{1,3}\s|^\s*[-*]\s|^\s*\d+[.)]\s/.test(lines[i])) para.push(inline(lines[i++]));
    out.push(`<p>${para.join('<br>')}</p>`);
  }
  return out.join('');
}

/* ---------- chat rendering ---------- */
const chat = $('#view-chat');
function scrollDown(){ chat.scrollTop = chat.scrollHeight; }
function timeStr(ts){ const d = ts ? new Date(ts*1000) : new Date(); return d.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'}); }
function empty(){
  const n = S.snap ? S.snap.settings.assistant_name : 'Buddy';
  const boss = S.snap ? S.snap.settings.boss_name : '';
  const ideas = [['Ask a question','Explain, plan or brainstorm anything','',''],['Work on my project','Fix a bug or build a feature (Do mode)','Fix ','do'],['Summarize files','Drop files here first, then ask','Summarize the attached files',''],['Set a reminder','"/remind 25m take a break"','/remind 25m ','']];
  chat.innerHTML = `<div class="empty"><div class="face"></div><h3>${boss ? `Hi ${esc(boss)}, what` : 'What'} should we do?</h3><div>I'm ${esc(n)}. Pick a starting point or just type below.</div>
  <div class="ideas">${ideas.map(([t,d,q,m]) => `<button class="idea" data-q="${esc(q)}" data-m="${m}"><b>${esc(t)}</b><small>${esc(d)}</small></button>`).join('')}</div></div>`;

  $('#c_check').onclick = async () => { $('#c_check').textContent = 'Checking…'; showCli(await call('cli_check')); $('#c_check').textContent = 'Check now'; };

    const problems = await call('save_settings', { assistant_name:$('#s_assistant').value, boss_name:$('#s_boss').value, display_mode:mode, workdir:$('#s_workdir').value, autostart:$('#s_auto').checked, reduce_motion:$('#s_reduce').checked, notch_lock:$('#s_lock').checked, pet_lock:$('#s_petlock').checked, auto_update:$('#s_autoupd').checked, verify_do:$('#s_verify').checked }) || [];

  cat: '<svg viewBox="0 0 100 100"><g fill="#f3f4fb"><path d="M16 44L22 8l30 22z"/><path d="M84 44L78 8 48 30z"/><path d="M8 58C8 38 26 26 50 26s42 12 42 32c0 20-16 36-42 36S8 78 8 58z"/></g><g stroke="#f3f4fb" stroke-width="2.2" stroke-linecap="round" opacity=".9"><path d="M2 56h12M2 63h12M86 56h12M86 63h12"/></g><rect x="35" y="46" width="8" height="14" rx="4" fill="#181b28"/><rect x="57" y="46" width="8" height="14" rx="4" fill="#181b28"/></svg>',
  ghost: '<svg viewBox="0 0 100 100"><path fill="#f3f4fb" d="M14 48C14 26 30 10 50 10s36 16 36 38v40c0 4-4 6-7 4l-6-5-6 6c-2 2-5 2-7 0l-6-6-6 6c-2 2-5 2-7 0l-6-6-6 5c-3 2-7 0-7-4z"/><rect x="35" y="36" width="8" height="16" rx="4" fill="#181b28"/><rect x="57" y="36" width="8" height="16" rx="4" fill="#181b28"/></svg>',
  blob: '<svg viewBox="0 0 100 100"><path fill="#f3f4fb" d="M38 12C58 2 86 12 92 34c5 20-6 40-20 54C58 102 24 98 12 78 0 58 16 22 38 12z"/><rect x="37" y="46" width="8" height="14" rx="4" fill="#181b28"/><rect x="57" y="46" width="8" height="14" rx="4" fill="#181b28"/></svg>',
};
const SKIN_META = [['classic','Classic','The original round face.'],['antenna','Antenna bot','Dome head, two springy antennas, dark visor.'],['boxy','Boxy bot','Square head, ears, single antenna.'],['cat','Cat','Ears with physics, whiskers.'],['ghost','Ghost','Wavy tail, floats a little more.'],['blob','Blob','Squashy drop — extra bounce.'],['custom','My image','Your own PNG/SVG silhouette.']];
function skinFaceHtml(skin, custom){
  if (skin === 'custom' && custom && custom.path) return `<img src="${fileUrl(custom.path)}?v=${custom.v||0}" alt="" style="width:100%;height:100%;object-fit:contain" draggable="false">`;
  return SKIN_SVG[skin] || SKIN_SVG.classic;
}
function applySkin(){
  const s = S.snap ? S.snap.settings : null; if (!s) return; const skin = s.skin || 'classic';
  document.body.dataset.skin = skin;
  document.querySelectorAll('.face').forEach(f => { if (skin === 'classic') { f.innerHTML = ''; f.classList.remove('skinned'); } else { f.classList.add('skinned'); const h = skinFaceHtml(skin, s.custom_skin); if (f.dataset.skinHtml !== h) { f.dataset.skinHtml = h; f.innerHTML = h; } } });
}
async function renderSkins(){
  const v = $('#view-skins'); const s = S.snap.settings; const cur = s.skin || 'classic'; const c = s.custom_skin || {};
  v.innerHTML = `<div class="section"><h4>Skin</h4><div class="note" style="margin:0 0 10px">Click one — Buddy changes instantly everywhere (notch, pet, this panel). All expressions, mouse-tracking and physics work on every skin.</div>
    <div class="skins">${SKIN_META.map(([k,l,d]) => `<button class="skin ${cur===k?'active':''}" data-k="${k}"><div class="prev">${skinFaceHtml(k, c)}</div><b>${l}</b><small>${d}</small></button>`).join('')}</div></div>
    <div class="section" id="sk_custom" style="display:${cur==='custom'?'':'none'}"><h4>My image</h4>
      <div class="row"><button class="btn primary" id="sk_pick">Pick image…</button><span class="note" style="margin:0" id="sk_name">${c.path?esc(c.path.split(/[\\\\/]/).pop()):'A white silhouette PNG with transparent background works best (SVG/WebP ok).'}</span></div>
      <div class="note" style="margin:8px 0 4px">Face box — where the eyes and mouth sit, in % of the image: left · top · width · height</div>
      <div class="row">${['x','y','w','h'].map((k,i)=>`<input class="in" id="sk_cb${i}" type="number" min="0" max="100" value="${(c.box||[25,38,50,34])[i]}" style="width:64px">`).join('')}<label class="toggle" style="margin:0 0 0 8px"><input type="checkbox" id="sk_ink" ${c.ink==='light'?'checked':''}> Light eyes (for dark images)</label></div>
      <div class="row" style="margin-top:8px"><button class="btn" id="sk_save">Apply box</button></div></div>`;
  v.querySelectorAll('.skin').forEach(b => b.onclick = async () => { const k = b.dataset.k; v.querySelectorAll('.skin').forEach(x => x.classList.toggle('active', x===b)); $('#sk_custom').style.display = k==='custom' ? '' : 'none'; if (k === 'custom' && !(S.snap.settings.custom_skin||{}).path) { $('#sk_pick').click(); return; } await call('save_settings', { skin: k }); });
  $('#sk_pick').onclick = async () => { const r = await call('skin_pick_image'); if (r && r.error) alert(r.error); else if (r) { S.snap.settings.custom_skin = r; S.snap.settings.skin = 'custom'; renderSkins(); applySkin(); } };
  $('#sk_save').onclick = async () => { await call('save_settings', { skin: 'custom', custom_skin: { box: [0,1,2,3].map(i => +$('#sk_cb'+i).value), ink: $('#sk_ink').checked ? 'light' : 'dark' } }); toast('Applied.'); };
}

/* ---------- toast ---------- */
let toastT; function toast(t){ const el = $('#toast'); el.classList.toggle('low', S.view && S.view!=='chat'); el.textContent=t; el.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(()=>el.classList.remove('show'), 2200); }

/* ---------- events from Python ---------- */
window.buddy = {
  on(kind, p){
    p = p || {};
    switch(kind){
      case 'chat.user': addUser(p.text, null, p.images); break;
      case 'chat.begin': setBusy(true); beginAI(p.label + (p.agent ? ' · doing' : ''), p.provider, (providerByName(p.provider)||{}).accent); break;
      case 'chat.text': streamText(p.chunk); break;
      case 'chat.step': addStep(p.tool, p.detail, p.status); break;
      case 'chat.done': finishAI(p.text); setBusy(false); break;
      case 'login': loginCard(p); break;
      case 'update': if (S.showUpd) S.showUpd(p); if (p.state === 'ready' && !document.getElementById('updcard')) { const m = document.createElement('div'); m.className = 'msg sys'; m.id = 'updcard'; m.innerHTML = `<div class="pill"><div class="face"></div><div>Buddy ${esc(p.version)} is ready ✨ <button class="chip" id="updnow" style="margin-left:6px">Restart &amp; update</button></div></div>`; chat.appendChild(m); m.querySelector('#updnow').onclick = () => call('update_apply'); applySkin(); scrollDown(); } break;
      case 'chat.error': if(S.current){ if(S.text) finishAI(); else { S.current.remove(); S.current=null; } } setBusy(false); addSystem(p.message, !p.stopped); break;
      case 'chat.system': addSystem(p.text, p.error); break;
      case 'permission': addPermission(p); break;
      case 'permission.done': settlePermission(p.id, p.behavior); break;
      case 'chat.cleared': chat.innerHTML=''; empty(); break;
      case 'provider': if(S.snap){ S.snap.provider = p; } renderProvider(p); break;
      case 'cli': if (S.showCli && S.view === 'settings') S.showCli(p); break;
      case 'chat.history': if(S.snap){ S.snap.chat = p.chat; } if(!S.busy){ S.current=null; renderHistory(p.chat); setTimeout(jumpToMessage, 60); } break;
      case 'files': if(S.snap) S.snap.files = p.files; renderFiles(p.files); if(p.added&&p.added.length) toast(`Attached ${p.added.length} file${p.added.length>1?'s':''}`); break;
      case 'tasks': if(S.snap) S.snap.tasks = p.tasks; if(S.view==='tasks') renderTasks(p.tasks); break;
      case 'reminders': if(S.snap) S.snap.reminders = p.reminders; if(S.view==='tasks'){ planCounts(); renderReminderList(); } break;
      case 'schedules': if(S.snap) S.snap.schedules = p.schedules; if(S.view==='tasks'){ planCounts(); renderScheduleList(); } break;
      case 'jobs': if(S.snap) S.snap.jobs = p.jobs; if(S.view==='tasks'){ planCounts(); if (S.ptab==='activity') renderJobList(); } break;
      case 'job.text': if(S.snap){ const j = (S.snap.jobs||[]).find(x => x.id === p.id); if (j) { j.output = p.output; if (p.steps) j.steps = p.steps; } } if(S.view==='tasks' && S.ptab==='activity'){ const el = document.querySelector(`.job[data-id="${p.id}"] .jout`); if (el) { el.textContent = String(p.output||'').trim().slice(-4000); } else renderJobList(); } break;
      case 'workflows': if(S.snap) S.snap.workflows = p.workflows; if(S.view==='tasks'){ planCounts(); if (S.ptab==='workflows' && !document.querySelector('#wf_edit .pform')) renderWorkflows(); } break;
      case 'pick.tip': showPickTip(p); break;
      case 'quick.to_chat': addSystem('Quick action result:\n' + p.text); break;
      case 'voice': S.listening = p.state === 'listening'; $('#mic').classList.toggle('on', S.listening); break;
      case 'settings': if(S.snap) S.snap.settings = p.settings; $('#name').textContent = p.settings.assistant_name; renderMode(!!p.settings.agent_mode); applySkin(); if (S.view==='skins') renderSkins(); break;
      case 'reminder': addSystem('⏰ Reminder: '+p.message); toast('⏰ ' + p.message); break;
      case 'agent': if(p.state==='waiting'||p.state==='error') toast(`${p.agent[0].toUpperCase()+p.agent.slice(1)} ${p.state==='waiting'?'needs you':'hit an error'}`); break;
      case 'show': if (!S.snap) { S.pendingView = p.view || 'chat'; break; } show(p.view||'chat'); input.focus(); break;
    }
  },
  boot(snap){
    S.snap = snap; $('#name').textContent = snap.settings.assistant_name; input.placeholder = `Message ${snap.settings.assistant_name}…`;
    renderProvider(snap.provider); renderFiles(snap.files); renderHistory(snap.chat); setBusy(snap.busy); renderMode(!!snap.agent_mode); applySkin(); input.focus();
    if (S.pendingView) { const v = S.pendingView; S.pendingView = null; show(v); }
    call('login_status').then(st => { if (st) loginCard(st); }).catch(() => {});
  }
};
async function init(){ const snap = await call('boot'); if (snap) window.buddy.boot(snap); }
if (api()) init(); else window.addEventListener('pywebviewready', init);
})();
</script>
