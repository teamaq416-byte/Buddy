<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Buddy island</title>
<style>
:root{--plate:#0c0d12;--edge:rgba(255,255,255,.09);--fg:#eef0fa;--muted:#969cb2;--dim:#60667c;--accent:#7dd3fc;--accent-rgb:125,211,252;--ok:#5eead4;--warn:#fbbf77;--bad:#ff7882;--blue:#7dd3fc;
  --font:"Segoe UI Variable Text","Segoe UI",system-ui,-apple-system,sans-serif;--mono:"Cascadia Mono",Consolas,ui-monospace,monospace;--spring:cubic-bezier(.22,.9,.3,1)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;background:transparent;overflow:hidden;font:12px/1.4 var(--font);color:var(--fg);user-select:none;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}

/* ---------- face (flat, like the reference) ---------- */
.face{position:relative;width:62px;height:62px;border-radius:50%;background:#f3f4fb;flex:none;--ex:0px;--ey:0px;--ink:#181b28;contain:layout paint style;transform-origin:50% 92%;will-change:transform}
.face .feat{position:absolute;inset:0}
.face .shell{display:none;position:absolute;inset:0;width:100%;height:100%}
.face .eye{position:absolute;top:33%;width:12%;height:30%;border-radius:999px;background:var(--ink);transform:translate3d(calc(var(--ex) * var(--track,1)),calc(var(--ey) * var(--track,1)),0);transition:height .1s,top .1s;will-change:transform}
.face .eye.l{left:29%}.face .eye.r{right:29%}
.face .mouth{position:absolute;left:50%;top:66%;width:16%;height:9%;transform:translateX(-50%);border:0 solid var(--ink);border-bottom-width:2.5px;border-radius:0 0 999px 999px;opacity:0}
.face .brow{position:absolute;top:19%;width:18%;height:10%;border-top:2.5px solid var(--ink);border-radius:999px 999px 0 0;opacity:0;transition:opacity .15s}
.face .brow.l{left:27%}.face .brow.r{right:27%}
.face .blush{position:absolute;top:60%;width:14%;height:8%;border-radius:50%;background:rgba(255,150,160,.5);opacity:0;transition:opacity .2s}
.face .blush.l{left:14%}.face .blush.r{right:14%}
.face .spiral{position:absolute;top:30%;width:22%;height:22%;opacity:0}
.face .spiral.l{left:24%}.face .spiral.r{right:24%}
.face .zz{position:absolute;right:-6%;top:-10%;font:700 12px var(--font);color:#9aa0b8;opacity:0}
.face.blink .eye{height:5%!important;top:46%!important}
.face.working .eye{height:22%!important;top:37%!important;animation:scan 2.4s ease-in-out infinite}
.face.working .eye.r{animation-delay:.06s}
@keyframes scan{0%,18%{margin-left:0}30%,48%{margin-left:-9%}60%,78%{margin-left:9%}90%,100%{margin-left:0}}
.think{display:none;gap:4px;align-items:center}.think i{width:5px;height:5px;border-radius:50%;background:var(--accent);animation:think 1.2s ease-in-out infinite}.think i:nth-child(2){animation-delay:.2s}.think i:nth-child(3){animation-delay:.4s}
@keyframes think{0%,80%,100%{opacity:.25;transform:translateY(0)}40%{opacity:1;transform:translateY(-3px)}}
.working .think{display:flex}
.face.waiting .eye{height:34%!important;top:31%!important}.face.waiting .brow{opacity:1}.face.waiting .mouth{opacity:.9;width:10%;height:10%;border-width:2.5px;border-radius:50%}
.face.done .eye{height:5%!important;top:40%!important;border-radius:999px;transform:translate3d(calc(var(--ex) * var(--track,1)),calc(var(--ey) * var(--track,1)),0) scaleX(1.4)}.face.done .mouth{opacity:.9;width:22%;height:12%;border-bottom-width:3px}.face.done .blush{opacity:1}
.face.happy .eye{height:5%!important;top:40%!important;border-radius:999px;transform:translate3d(calc(var(--ex) * var(--track,1)),calc(var(--ey) * var(--track,1)),0) scaleX(1.4)}.face.happy .mouth{opacity:.9;width:22%;height:12%;border-bottom-width:3px}.face.happy .blush{opacity:1}
.face.error .eye{height:16%!important;top:40%!important}.face.error .brow{opacity:1;top:22%}.face.error .brow.l{transform:rotate(-14deg)}.face.error .brow.r{transform:rotate(14deg)}
.face.error .mouth{opacity:.9;width:14%;height:7%;top:69%;border-bottom-width:0;border-top-width:2.5px;border-radius:999px 999px 0 0}
.face.ponder .eye{height:24%!important;top:28%!important}.face.ponder .brow{opacity:.5}
.face.listen .eye{height:33%!important;top:31%!important}.face.listen .brow{opacity:.45}
.face.remind .eye{height:36%!important;top:29%!important}.face.remind .brow{opacity:1}.face.remind .mouth{opacity:.9;width:10%;height:10%;border-width:2.5px;border-radius:50%}
.face.receive .eye{height:34%!important;top:30%!important}.face.receive .mouth{opacity:1;width:16%;height:16%;border-width:2.5px;border-radius:50%;background:var(--ink);animation:chew .35s ease-in-out infinite alternate}
.face.speak .mouth{opacity:1;width:14%;height:12%;border-width:2.5px;border-radius:40%;background:var(--ink);animation:talk .22s ease-in-out infinite alternate}
.face.sleep .eye{height:5%!important;top:46%!important}.face.sleep .zz{opacity:1;animation:zz 2.4s ease-in-out infinite}
.face.startle .eye{height:36%!important;top:29%!important;width:14%!important}
@keyframes breathe{50%{transform:scale(1.035) translateY(1px)}}
@keyframes jolt{0%{transform:scale(1)}15%{transform:translateY(-7px) scale(1.06,.94)}35%{transform:translateY(0) scale(.96,1.05) rotate(-4deg)}55%{transform:rotate(4deg)}75%{transform:rotate(-2deg)}100%{transform:none}}
@keyframes spin{to{transform:rotate(360deg)}}@keyframes chew{to{transform:translateX(-50%) scaleY(.55)}}@keyframes talk{to{transform:translateX(-50%) scaleY(.4)}}
@keyframes zz{0%,100%{transform:translateY(0);opacity:.6}50%{transform:translateY(-6px);opacity:1}}
@keyframes squash{30%{transform:scale(1.08,.92)}60%{transform:scale(.97,1.03)}}


/* work reactions */
.face.reading .eye{height:20%!important;top:38%!important;animation:readscan 1.1s steps(6,end) infinite}
@keyframes readscan{0%{margin-left:-8%}100%{margin-left:8%}}
.face.typing .eye{height:22%!important;top:40%!important}
@keyframes taptap{to{transform:translateY(2px) scale(1.015,.985)}}
.face.running .eye{height:24%!important;top:28%!important}
.face.running::after{content:"";position:absolute;inset:-6px;border-radius:50%;border:1.5px solid transparent;border-top-color:var(--accent);animation:spin 1.4s linear infinite;opacity:.6}
@keyframes nod{30%{transform:translateY(5px) rotate(2deg)}60%{transform:translateY(-2px)}}
@keyframes tilt{35%{transform:rotate(-9deg)}70%{transform:rotate(-9deg)}}
.face.yawn .eye{height:5%!important;top:46%!important}.face.yawn .mouth{opacity:1;width:20%;height:22%;border-width:2.5px;border-radius:45%;background:var(--ink);animation:yawn 1.5s ease-in-out}
@keyframes yawn{0%{transform:translateX(-50%) scaleY(.2)}40%,70%{transform:translateX(-50%) scaleY(1)}100%{transform:translateX(-50%) scaleY(.2)}}
@keyframes stretch{30%{transform:scale(.96,1.08) translateY(-3px)}60%{transform:scale(1.04,.96)}}
@keyframes hop{30%{transform:translateY(-10px) scale(1.04,.96)}60%{transform:translateY(0) scale(.97,1.03)}}
.face.glance .eye{margin-left:-9%!important}.face.glance.r .eye{margin-left:9%!important}
.face.dblblink .eye{animation:dbl .5s steps(1,end)}
@keyframes dbl{0%,40%,60%{height:5%;top:46%}20%,50%,100%{height:30%;top:33%}}
@keyframes dropb{0%{transform:scale(1.06,.94)}40%{transform:scale(.94,1.06)}100%{transform:none}}
/* step rows slide in, check draws */
.row{animation:rowin .28s cubic-bezier(.2,.8,.2,1)}
@keyframes rowin{from{opacity:0;transform:translateX(-8px)}}
.row.done .ico svg path{stroke-dasharray:24;stroke-dashoffset:24;animation:draw .35s ease-out forwards}
@keyframes draw{to{stroke-dashoffset:0}}
/* waiting reply: pill breathes */
#notch.busy:not(.open){animation:breathw 1.6s ease-in-out infinite}
@keyframes breathw{50%{width:242px}}
/* reduce motion switch */
body.reduce *{animation:none!important;transition:none!important}

/* ---------- notch plate ---------- */
#nw{position:absolute;left:50%;top:0;transform:translateX(-50%);transform-origin:50% 0;will-change:transform,width,height;width:200px;height:38px;transition:width .42s var(--spring),height .42s var(--spring)}
#nw.label{width:236px}
#nw.open{width:520px;height:196px}
#nw.open.reply{height:290px}
/* MacBook-style ears: concave fillets blending the notch into the top edge */
/* ears overlap the body by 1px and carry no border/shadow of their own → one seamless silhouette; the shadow is a filter on the whole shape */
#nw::before,#nw::after{content:"";position:absolute;top:0;width:17px;height:16px;background:radial-gradient(circle at 0 100%,transparent 15.3px,var(--plate) 16px);pointer-events:none}
#nw::before{left:-16px}
#nw::after{right:-16px;transform:scaleX(-1)}
#nw{filter:drop-shadow(0 8px 14px rgba(0,0,0,.45))}
body.dropping #notch,body.dropping #pet .face{outline:2px dashed rgba(94,234,212,.8);outline-offset:3px}
#notch{position:absolute;inset:0;contain:layout paint style;background:var(--plate);border:0;box-shadow:inset 0 -1px 0 rgba(255,255,255,.06);border-radius:0 0 19px 19px;overflow:hidden;transition:border-radius .3s}
#notch.open{border-radius:0 0 28px 28px}
/* camera lens (collapsed) */
.lens{width:14px;height:14px;border-radius:50%;flex:none;background:radial-gradient(circle at 50% 50%,#0a0b10 0 2.2px,#1d4ed8 2.6px 3.6px,#38bdf8 3.9px 4.6px,#0b1220 5px 5.6px,#1a1c24 5.9px 6.4px,#06070a 6.6px);box-shadow:inset 0 0 0 1px rgba(255,255,255,.07),0 0 0 1px rgba(0,0,0,.6);position:relative}
.lens::after{content:"";position:absolute;left:4px;top:3px;width:3px;height:2px;border-radius:50%;background:rgba(255,255,255,.55);transform:rotate(-30deg)}
.lens.on{background:radial-gradient(circle at 50% 50%,#0a0b10 0 2.2px,var(--accent) 2.6px 4.6px,#0b1220 5px 5.6px,#1a1c24 5.9px 6.4px,#06070a 6.6px)}
.lens.pulse{animation:pulse 1.1s ease-in-out infinite}
.collapsed{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;gap:10px;padding:0 14px;transition:opacity .18s}
.collapsed .label,.collapsed .dot{display:none}
#nw.label .collapsed{justify-content:flex-start}#nw.label .collapsed .label,#nw.label .collapsed .dot{display:block}
.collapsed .face{width:26px;height:26px;flex:none}
.collapsed .label{flex:1;font-weight:600;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dot{width:7px;height:7px;border-radius:50%;background:var(--dim);flex:none}
.dot.pulse{animation:pulse 1.1s ease-in-out infinite}
@keyframes pulse{50%{opacity:.3}}
#notch.open .collapsed{opacity:0;pointer-events:none}
.expanded{position:absolute;inset:0;opacity:0;pointer-events:none;transition:opacity .25s .12s;padding:20px 24px 0}
#notch.open .expanded{opacity:1;pointer-events:auto}
.cols{display:flex;gap:16px;height:124px}
.left{width:86px;display:flex;flex-direction:column;align-items:flex-start;gap:0;padding-top:2px}
.left .name{font-weight:600;font-size:13px;margin-top:12px;max-width:86px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.left .role{font-size:11px;color:var(--muted)}
.vline{width:1px;background:rgba(255,255,255,.07);margin:0 0 0 -2px}
.mid{flex:1;min-width:0;display:flex;flex-direction:column}
.head{display:flex;align-items:center;gap:8px;font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sub{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.rows{margin-top:8px;display:flex;flex-direction:column;gap:3px}
.row{display:flex;align-items:center;gap:8px;font-size:12px;height:17px;white-space:nowrap;overflow:hidden}
.row .ico{width:12px;height:12px;flex:none;display:grid;place-items:center}
.row .ico svg{width:12px;height:12px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.row.running .ico{color:var(--blue)}.row.running .ico svg{animation:spin 1s linear infinite}
.row.done .ico{color:var(--ok)}.row.error .ico{color:var(--bad)}
.row b{font-weight:500;min-width:56px}.row code{font-family:var(--mono);font-size:11px;color:var(--muted);overflow:hidden;text-overflow:ellipsis}
.row .v{color:var(--muted);margin-left:auto;max-width:130px;overflow:hidden;text-overflow:ellipsis}
.right{width:132px;display:grid;grid-template-columns:1fr 1fr;grid-auto-rows:34px;gap:8px;align-content:start}
.qa{border-radius:11px;background:rgba(255,255,255,.055);font-size:12px;font-weight:500;transition:background .15s;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 6px}
.qa:hover{background:rgba(255,255,255,.13)}
.foot{grid-column:1/3;font-size:11px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;align-self:start;margin-top:-6px}
.replybox{position:absolute;left:142px;right:24px;top:108px;max-height:calc(100% - 108px - 62px);background:rgba(255,255,255,.04);border-radius:12px;padding:8px 11px;font-size:12px;line-height:17px;overflow:hidden;opacity:0;pointer-events:none;transition:opacity .2s;cursor:pointer;white-space:pre-wrap;word-break:break-word}
#notch.reply .replybox{opacity:1;pointer-events:auto}
.perm{display:none;margin:6px 0 2px;padding:8px 10px;border-radius:12px;background:rgba(251,191,119,.10);border:1px solid rgba(251,191,119,.28);font-size:12px;line-height:16px}
.perm.show{display:block}
.perm b{color:var(--warn)}.perm code{display:block;color:var(--muted);font-size:11px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.perm .btns{display:flex;gap:6px;margin-top:7px}
.perm button{font:inherit;font-size:11px;font-weight:600;border:0;border-radius:999px;padding:5px 11px;cursor:pointer;background:rgba(255,255,255,.08);color:var(--fg)}
.perm button.allow{background:var(--warn);color:#1a1206}.perm button.deny{color:var(--bad)}
#notch .perm{position:absolute;left:142px;right:24px;bottom:62px;z-index:3;background:#2a2114}

#notch.reply .rows,#notch.reply .foot{display:none}
#notch.reply .right{grid-auto-rows:34px}
.rimgs{display:grid;gap:4px;margin-top:6px;max-width:240px}.rimgs.n2,.rimgs.n3{grid-template-columns:1fr 1fr}
.rimg{position:relative;margin:0;border-radius:10px;overflow:hidden;background:#000}.rimg img{display:block;width:100%;max-height:240px;object-fit:cover;cursor:zoom-in}.rimgs.n2 .rimg img,.rimgs.n3 .rimg img{height:110px}
.rimg .dl{position:absolute;right:6px;bottom:6px;width:28px;height:28px;border-radius:50%;background:rgba(0,0,0,.55);display:grid;place-items:center;opacity:.85;transition:opacity .15s,transform .12s}.rimg .dl:hover{opacity:1}.rimg .dl:active{transform:scale(.92)}
.rimg .dl svg{width:15px;height:15px;fill:none;stroke:#fff;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
#pet .btext .m .rimgs:first-child{margin:-2px -6px 4px}#pet .btext .m .rimgs:last-child{margin-bottom:-2px}#reply .rimgs .rimg img{max-height:120px}
.replybox .cur{display:inline-block;width:6px;height:13px;background:var(--accent);border-radius:2px;vertical-align:-2px;margin-left:2px;animation:pulse .9s ease-in-out infinite}
.composer{position:absolute;left:24px;right:24px;bottom:14px;height:34px;border-radius:17px;background:rgba(255,255,255,.06);border:1px solid transparent;display:flex;align-items:center;padding:0 5px 0 14px;gap:8px;transition:background .15s,border-color .15s}
.composer:focus-within{background:rgba(255,255,255,.09);border-color:rgba(var(--accent-rgb),.6)}
.composer input{flex:1;min-width:0;background:none;border:0;outline:0;color:var(--fg);font:12px var(--font)}
.composer input::placeholder{color:var(--dim)}
.mode{height:22px;padding:0 10px;border-radius:11px;background:rgba(255,255,255,.1);font-size:11px;font-weight:600;color:var(--fg);transition:background .15s,color .15s}
.mode.on{background:var(--accent);color:#0c0d12}
.send{width:26px;height:26px;border-radius:50%;background:var(--accent);display:grid;place-items:center;transition:transform .12s,background .15s}
.clip.on{color:#f87171;background:rgba(248,113,113,.14)}
.clip{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;color:var(--muted);flex:none;transition:background .15s,color .15s}.clip:hover{background:rgba(255,255,255,.1);color:var(--fg)}
.clip svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#pet .pfiles{display:flex;flex-wrap:wrap;gap:5px;justify-content:flex-end;margin-top:6px}#pet .pfiles:empty{display:none}
#pet .pfiles .f{display:flex;align-items:center;gap:5px;height:30px;padding:0 4px 0 3px;border-radius:9px;background:rgba(12,13,18,.84);border:1px solid var(--edge);font-size:11px;color:var(--fg);max-width:170px}
#pet .pfiles .f img{width:24px;height:24px;border-radius:6px;object-fit:cover;background:#000}
#pet .pfiles .f.pic{height:auto;padding:4px;flex-direction:column;align-items:stretch;position:relative;max-width:150px}#pet .pfiles .f.pic img{width:140px;height:100px;border-radius:7px}#pet .pfiles .f.pic span{display:none}#pet .pfiles .f.pic b{position:absolute;top:7px;right:7px;background:rgba(0,0,0,.6);color:#fff}#pet .pfiles .f span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#pet .pfiles .f b{width:18px;height:18px;border-radius:50%;display:grid;place-items:center;color:var(--muted);cursor:pointer;font-weight:400}#pet .pfiles .f b:hover{background:rgba(255,255,255,.12);color:var(--fg)}
.send:active{transform:scale(.92)}.send.stop{background:var(--bad)}
.send svg{width:12px;height:12px;fill:none;stroke:#0c0d12;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.send.stop svg{fill:#0c0d12;stroke:none}
.shimmer{position:absolute;left:14px;right:14px;bottom:0;height:2px;opacity:0;background:linear-gradient(90deg,transparent 0%,var(--accent) 50%,transparent 100%);background-size:40% 100%;background-repeat:no-repeat}
#notch.busy .shimmer{opacity:.85;animation:shim 1.6s linear infinite}
@keyframes shim{from{background-position:-40% 0}to{background-position:140% 0}}

/* ---------- toast ---------- */
#toast{position:absolute;left:50%;will-change:transform,opacity;transform:translate(-50%,-6px);top:0;max-width:380px;background:var(--plate);border:1px solid var(--edge);border-radius:14px;padding:8px 14px;font-size:12px;line-height:17px;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s var(--spring);box-shadow:0 10px 30px rgba(0,0,0,.5)}
#toast.show{opacity:1;transform:translate(-50%,0)}
#toast::before{content:"";position:absolute;left:50%;top:-6px;width:12px;height:12px;background:var(--plate);transform:translateX(-50%) rotate(45deg);border-left:1px solid var(--edge);border-top:1px solid var(--edge)}

/* ---------- pet ---------- */
body.pet #nw,body.pet #toast{display:none}
#pet{display:none;position:absolute;inset:0;align-items:flex-end;justify-content:flex-end;flex-direction:column;padding:0 18px 12px 0}
body.pet-left #pet{align-items:flex-start;padding:0 0 12px 18px}
#pet .tag.chatting .think{display:none!important}
#pet .ptoast{position:absolute;right:14px;bottom:136px;max-width:300px;padding:6px 12px;border-radius:14px;background:rgba(12,13,18,.86);border:1px solid var(--edge);font-size:12px;opacity:0;transform:translateY(6px);transition:opacity .25s,transform .35s cubic-bezier(.34,1.5,.64,1);pointer-events:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#pet .ptoast.show{opacity:1;transform:none}
/* Messenger-style reply card: when the pet chat is closed, the bot's answer pops up next to the pet with a quick-reply box */
#pet .pnote{position:absolute;right:14px;bottom:136px;width:286px;background:rgba(14,15,21,.95);backdrop-filter:blur(12px);border:1px solid var(--edge);border-radius:18px;padding:10px 10px 8px;box-shadow:0 14px 34px rgba(0,0,0,.45);opacity:0;transform:translateY(14px) scale(.92);transform-origin:90% 100%;transition:opacity .22s,transform .38s cubic-bezier(.34,1.56,.64,1);pointer-events:none}
body.pet-left #pet .pnote{right:auto;left:14px;transform-origin:10% 100%}
#pet .pnote.show{opacity:1;transform:none;pointer-events:auto}
#pet .pnote .ph{display:flex;align-items:center;gap:7px;font-size:12px;margin-bottom:6px}#pet .pnote .ph b{flex:1}
#pet .pnote .pnface{width:18px;height:18px;border-radius:50%;background:#f3f4fb;position:relative}#pet .pnote .pnface::before,#pet .pnote .pnface::after{content:"";position:absolute;top:5px;width:2.5px;height:7px;border-radius:2px;background:#181b28;left:5.5px}#pet .pnote .pnface::after{left:10px}
#pet .pnote .pnx{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;color:var(--muted);cursor:pointer;font-size:15px}#pet .pnote .pnx:hover{background:rgba(255,255,255,.1);color:var(--fg)}
#pet .pnote .pt{font-size:12.5px;line-height:17px;max-height:120px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:6;-webkit-box-orient:vertical;white-space:pre-wrap;word-break:break-word;cursor:pointer;padding:2px 2px 0}
#pet .pnote .pt .rimgs{max-width:150px;margin:0 0 6px}#pet .pnote .pt .rimg img{max-height:110px}#pet .pnote .pt .you{color:var(--muted)}

<script>
const BG = { data: null, busy: false, shown: false, sx: 0, sy: 0, movedAt: 0 }; // frosted backdrop state (declared first: paint() reads it)

const $ = s => document.querySelector(s);

const KEEP = ['mini', 'main', 'nod', 'tilt', 'dblblink', 'glance', 'r', 'dragging', 'lean-l', 'lean-r', 'drop', 'blink'];

function fx(cls, ms) { for (const f of document.querySelectorAll('.face')) { f.classList.add(...cls.split(' ')); setTimeout(() => f.classList.remove(...cls.split(' ')), ms); } }
setInterval(() => { for (const f of document.querySelectorAll('.face')) f.classList.add('blink'); setTimeout(() => { for (const f of document.querySelectorAll('.face')) f.classList.remove('blink'); }, 130); }, 3000 + Math.random() * 2000);

function expression() {

  const st = S.info ? S.info.headline[1] : 'idle';
  const agent = S.info && S.info.headline[0];

    if (S.replyLive) return (S.reply || '').trim() ? 'speak' : 'ponder';

  }
  if (S.replyLive) return (S.reply || '').trim() ? 'speak' : 'ponder';

// Eyes: cursor target → per-frame lerp (60 fps, no IPC-stepped transitions)
const eyes = { tx: 0, ty: 0, x: 0, y: 0, faces: [] };
function trackEyes() {
  if (!S.cursor) return;

    pf.style.setProperty('--hx', (-eyes.x * w * 0.07).toFixed(2) + 'px'); pf.style.setProperty('--hy', (-eyes.y * w * 0.05).toFixed(2) + 'px');

// ---------------------------------------------------------------- body physics
// Every reaction is a spring/impulse on the face body (position, squash-stretch, tilt) instead of a canned keyframe,

const BODY = new Map(); const G = 2600;
function body(el) { let b = BODY.get(el); if (!b) { b = { x: 0, vx: 0, y: 0, vy: 0, rot: 0, vrot: 0, sq: 0, vsq: 0, air: false, tilt: 0, sqBase: 0 }; BODY.set(el, b); } return b; }

const PH = { last: performance.now(), expr: '', since: 0, shakeUntil: 0, nextTick: 0, speakTick: 0 };
function bodyFrame() {
  const now = performance.now(); const dt = Math.min(0.05, (now - PH.last) / 1000) || 0.016; PH.last = now;

  const reduce = document.body.classList.contains('reduce'); const t = now / 1000; const age = (now - PH.since) / 1000;

    else if (base === 'waiting') { tilt = 8 + Math.sin(t * 1.3) * 1.5; if (now > PH.nextTick) { PH.nextTick = now + 1500 + Math.random() * 1200; const r = Math.random(); if (r < 0.4) kick({ jump: 170 }); else if (r < 0.7) kick({ sq: -1.6 }); else { eyes.override = { x: Math.random() < .5 ? -1 : 1, y: -0.6, until: Date.now() + 900 }; } } }
    else if (expr === 'working typing') { sqBase = 0; if (now > PH.nextTick) { PH.nextTick = now + 300; kick({ dip: 180 }); } }
    else if (expr === 'working running') { tilt = Math.sin(t * 2.2) * 3; sqBase = Math.sin(t * 4.4) * 0.012; }
    else if (expr === 'working reading') { tilt = -3 + Math.sin(t * 0.8) * 1.2; }
    else if (base === 'working') { sqBase = Math.sin(t / 2.4 * Math.PI * 2) * 0.02; }

    else if (base === 'ponder') { tilt = -5 + Math.sin(t * 0.9) * 2.5; sqBase = Math.sin(t * 1.8) * 0.01; if (now > PH.nextTick) { PH.nextTick = now + 1700 + Math.random() * 600; PH.alt = !PH.alt; eyes.override = { x: PH.alt ? -0.55 : 0.4, y: -0.8, until: Date.now() + 1800 }; } }

    else if (base === 'remind') { const k = Math.max(0, 1 - age / 1.8); tilt = Math.sin(t * 17) * 8 * k; if (age > 0.7 && now > PH.nextTick && age < 2.4) { PH.nextTick = now + 900; kick({ jump: 160 }); } }

    else if (base === 'yawn') { tilt = -6; sqBase = -0.03; }

function sparkle(n = 10, star = false) { for (const el of eyes.faces) { const host = el.parentElement; if (!host || !host.classList.contains('fw')) continue; for (let i = 0; i < n; i++) { const d = document.createElement('div'); d.className = 'spark' + (star && i % 3 === 0 ? ' star' : ''); const a = Math.random() * Math.PI * 2, r = 36 + Math.random() * 34; d.style.setProperty('--dx', Math.cos(a) * r + 'px'); d.style.setProperty('--dy', Math.sin(a) * r - 10 + 'px'); d.style.animationDelay = (Math.random() * 120) + 'ms'; host.appendChild(d); setTimeout(() => d.remove(), 1100); } } }

    case 'done': kick({ jump: 330, rot: 16 }); sparkle(6, true); break;   // satisfied hop, soft landing
    case 'happy': kick({ jump: 170, sq: -0.8 }); sparkle(4); break;       // pleased little bounce (click, task finished)
    case 'error': PH.shakeUntil = performance.now() + 360; kick({ sq: 0.7 }); break; // short "no" shake

    case 'receive': kick({ sq: -2.0, dip: -50 }); break;                 // stretches to catch
    case 'poke': kick({ sq: 2.2 }); break;                               // squish

// antenna physics: each antenna is a damped spring that lags behind the head's motion (drag, hop, nod, breathing) + a faint idle sway
const ant = { l: { a: 0, v: 0 }, r: { a: 0, v: 0 }, px: null, py: null, t: performance.now(), on: false };
